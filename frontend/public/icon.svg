<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="libra">
  <rect width="512" height="512" fill="#f3fbf7" />
  <!-- 天秤(libra=天秤座)を3要素だけに単純化したモチーフ(DESIGN.md Icon 節参照):
       正三角形(支点。頂点が上)/ 頂点の丸(支点の軸)/ その丸を通る水平の横棒(梁)。
       皿・吊り紐は描かない。左右対称・横棒は傾けず水平のまま。すべて面で塗り、
       favicon サイズ(16-32px)でも潰れない太さにする -->
  <g fill="#064e3b">
    <!-- 正三角形(支点) -->
    <path d="M256 180 L346 380 L166 380 Z" />
    <!-- 横棒(梁)。頂点の丸を貫通する水平バー。太さは全体幅の1/10以上 -->
    <rect x="90" y="160" width="332" height="40" />
    <!-- 頂点の丸(支点の軸) -->
    <circle cx="256" cy="180" r="54" />
  </g>
</svg>
